<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Payment received — Fincoursa Academy</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
         background:radial-gradient(120% 130% at 85% 0%, #7a5f1c 0%, rgba(122,95,28,0) 55%), linear-gradient(160deg,#1c1812 0%,#272016 55%,#15110a 100%);
         color:#f3efe4; font-family:'IBM Plex Sans',sans-serif; -webkit-font-smoothing:antialiased; }
  .card { background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.12); border-radius:20px; max-width:520px; width:100%; padding:44px 40px; text-align:center; }
  h1 { font-family:'Newsreader',serif; font-weight:500; font-size:34px; margin:16px 0 10px; color:#fff; }
  p { font-size:15px; line-height:1.6; color:#cec4ac; margin:0 0 10px; }
  .mono { font-family:'IBM Plex Mono',monospace; font-size:12px; color:#b3a785; }
  .tick { width:64px; height:64px; border-radius:50%; background:#cbb46a; color:#1a241c; display:inline-flex; align-items:center; justify-content:center; font-size:34px; }
  a.btn { display:inline-block; margin-top:22px; padding:13px 26px; border-radius:11px; background:#cbb46a; color:#1a241c; text-decoration:none; font-weight:700; font-size:15px; }
</style>
</head>
<body>
  <div class="card">
    <div class="tick">✓</div>
    <h1>Payment received</h1>
    <p>Thank you! Your crypto payment is confirmed and your enrollment is being set up.</p>
    <p><strong style="color:#fff;">Check your email</strong> — we've sent a link to set your password and start learning. It can take a minute to arrive.</p>
    <p class="mono" id="order"></p>
    <a class="btn" href="index.html">Back to Fincoursa →</a>
  </div>
  <script>
    var o = new URLSearchParams(location.search).get('order');
    if (o) document.getElementById('order').textContent = 'Order ' + o;
  </script>
</body>
</html>
