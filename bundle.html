<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Learning Path — Meridian Finance Academy</title>
<meta name="description" content="A complete Meridian learning path — several courses, one track, one price.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;0,600;1,400;1,500&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing:border-box; }
  html { scroll-behavior:smooth; }
  body { margin:0; background:#ffffff; color:#1a241c; font-family:'IBM Plex Sans',sans-serif; -webkit-font-smoothing:antialiased; }
  a { color:inherit; }
  h1,h2,h3 { font-family:'Newsreader',serif; font-weight:500; letter-spacing:-.01em; }
  .serif { font-family:'Newsreader',serif; }
  .mono { font-family:'IBM Plex Mono',monospace; }
  .kicker { font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.16em; }
  nav { position:sticky; top:0; z-index:50; display:flex; align-items:center; justify-content:space-between; padding:16px 44px; background:rgba(251,252,253,.86); backdrop-filter:blur(14px); border-bottom:1px solid #e4e2d9; }
  .btn-primary { display:inline-flex; align-items:center; gap:8px; text-decoration:none; padding:15px 28px; border-radius:11px; background:#b08d3c; color:#1a241c; font-size:15px; font-weight:700; border:none; cursor:pointer; }
  .btn-primary:hover { background:#c79b41; }
  .wrap { max-width:1080px; margin:0 auto; padding:0 44px; }
  /* dark premium hero */
  .hero { background:radial-gradient(120% 130% at 85% 0%, #235138 0%, rgba(35,81,56,0) 55%), linear-gradient(160deg,#163a29 0%,#1f4733 60%,#15311f 100%); color:#eef2ee; }
  .hero-inner { max-width:1080px; margin:0 auto; padding:64px 44px 70px; }
  .chip { display:inline-flex; align-items:center; gap:6px; font-family:'IBM Plex Mono',monospace; font-size:12px; color:#dce7df; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.18); border-radius:8px; padding:7px 13px; }
  .card { background:#fff; border:1px solid #e4e2d9; border-radius:16px; }
  .card-hover { transition:transform .25s ease, box-shadow .25s ease, border-color .25s ease; }
  .card-hover:hover { transform:translateY(-3px); box-shadow:0 22px 44px rgba(20,30,45,.1); border-color:#d4d1c5; }
  .grid-3 { display:grid; grid-template-columns:repeat(3,1fr); gap:22px; }
  @media (max-width:820px){ .grid-3 { grid-template-columns:1fr; } nav,.hero-inner,.wrap { padding-left:20px; padding-right:20px; } }
</style>
</head>
<body>
  <nav>
    <a href="index.html" style="display:flex; align-items:center; gap:11px; text-decoration:none;">
      <span style="width:26px; height:26px; border-radius:7px; background:#1f4733; display:flex; align-items:center; justify-content:center; font-family:'Newsreader',serif; font-weight:600; font-size:16px; color:#fff;">M</span>
      <span class="serif" style="font-weight:600; font-size:22px;">Meridian</span>
    </a>
    <div style="display:flex; gap:14px; align-items:center;">
      <a href="index.html#paths" style="text-decoration:none; color:#4a5260; font-size:14px; font-weight:500;">All paths</a>
      <a href="index.html#courses" style="text-decoration:none; color:#4a5260; font-size:14px; font-weight:500;">Courses</a>
      <a data-thinkific="signin" href="#" style="text-decoration:none; color:#1a241c; font-size:14px; font-weight:600;">Log in</a>
    </div>
  </nav>

  <main id="app">
    <div style="text-align:center; padding:90px 0; color:#8a92a0;">Loading learning path…</div>
  </main>

  <footer style="border-top:1px solid #e4e2d9; padding:34px 44px; background:#ffffff;">
    <div style="max-width:1080px; margin:0 auto; display:flex; justify-content:space-between; flex-wrap:wrap; gap:10px;">
      <span class="serif" style="font-weight:600; font-size:18px;">Meridian</span>
      <span class="mono" style="font-size:13px; color:#9aa0ab;">Powered by Thinkific</span>
    </div>
  </footer>

  <script src="meridian.js"></script>
  <script>
    const slug = new URLSearchParams(location.search).get('slug') || '';
    const app = document.getElementById('app');

    function notFound(){
      app.innerHTML = `<div style="text-align:center; padding:80px 20px;">
        <div class="kicker" style="color:#1f4733; margin-bottom:12px;">PATH NOT FOUND</div>
        <h1 style="font-size:34px; margin:0 0 14px;">We couldn't find that learning path.</h1>
        <a class="btn-primary" href="index.html#paths">See all learning paths</a>
      </div>`;
    }

    function courseCard(c){
      return `<a href="${coursePageUrl(c)}" class="card card-hover" style="text-decoration:none; color:#1a241c; display:block; overflow:hidden;">
        <div style="height:120px; background:linear-gradient(150deg, ${hexA(c.accent,.12)}, #fff); border-bottom:1px solid #e8e6dd; position:relative;">
          <svg viewBox="0 0 360 120" preserveAspectRatio="none" style="position:absolute; inset:0; width:100%; height:100%;">
            <polyline points="0,96 60,80 120,88 180,52 240,64 300,30 360,42" fill="none" stroke="${c.accent}" stroke-width="2.5"></polyline>
          </svg>
          <span class="mono" style="position:absolute; bottom:10px; left:12px; padding:4px 9px; border-radius:6px; background:rgba(255,255,255,.9); border:1px solid #e4e2d9; font-size:11px; color:#4a5260;">${esc(c.cat)}</span>
        </div>
        <div style="padding:16px 18px 18px;">
          <div style="font-size:13px; color:#6a7280; margin-bottom:7px;">${esc(c.instr)}</div>
          <h3 style="font-size:19px; line-height:1.15; margin:0 0 12px;">${esc(c.title)}</h3>
          <div style="display:flex; align-items:center; justify-content:space-between; padding-top:12px; border-top:1px solid #ece9e0;">
            <span style="font-size:12px; color:#8a92a0;">${esc(c.hours)} hrs · ${c.lessons} lessons</span>
            <span class="serif" style="font-size:18px; color:#1a241c;">$${c.price}</span>
          </div>
        </div>
      </a>`;
    }

    function render(p, members){
      const sumIndividual = members.reduce((a,c)=>a+(Number(c.price)||0),0);
      const save = sumIndividual - (p.price||0);
      const desc = (p.blurb || p.desc || `A complete ${p.name} — ${p.n} courses in one track.`).slice(0,158);
      const url = pageUrl('bundle.html', 'slug=' + encodeURIComponent(p.slug));
      applyMeta({ title: p.name + ' — Meridian Learning Path', description: desc, url });
      setJsonLd({ '@context':'https://schema.org', '@type':'Course', name:p.name, description:desc,
        provider:{ '@type':'Organization', name:'Meridian Finance Academy', sameAs:siteBase() },
        offers:{ '@type':'Offer', price:p.price, priceCurrency:'USD', url:bundleUrl(p) } });

      app.innerHTML = `
        <section class="hero">
          <div class="hero-inner">
            <a href="index.html#paths" style="text-decoration:none; color:#bcd2c2; font-size:13px;">← All learning paths</a>
            <div class="kicker" style="color:#cbb46a; margin:18px 0 14px;">LEARNING PATH</div>
            <h1 style="font-size:clamp(34px,5vw,60px); line-height:1.04; margin:0; color:#fff; max-width:16ch;">${esc(p.name)}</h1>
            <p style="font-size:18px; line-height:1.6; color:#cfe0d4; max-width:62ch; margin:20px 0 26px;">${esc(p.blurb || p.desc)}</p>
            <div style="display:flex; gap:9px; flex-wrap:wrap; margin-bottom:30px;">
              <span class="chip">${p.n} courses</span>
              <span class="chip">Guided order</span>
              <span class="chip">Certificate per course</span>
              <span class="chip">Lifetime access</span>
            </div>
            <div style="display:flex; align-items:center; gap:22px; flex-wrap:wrap;">
              <a class="btn-primary" href="${esc(bundleUrl(p))}" target="_blank" rel="noopener">Enroll in this track →</a>
              <div style="display:flex; align-items:baseline; gap:10px;">
                <span class="serif" style="font-size:40px; color:#fff;">$${p.price}</span>
                ${save>0 ? `<span style="color:#bcd2c2; font-size:14px;"><s style="color:#8aa593;">$${sumIndividual}</s> · save $${save}</span>` : ``}
              </div>
            </div>
          </div>
        </section>

        <section class="wrap" style="padding-top:56px; padding-bottom:30px;">
          <div class="kicker" style="color:#1f4733; margin-bottom:12px;">WHAT'S INCLUDED</div>
          <h2 style="font-size:clamp(26px,3vw,38px); margin:0 0 8px;">${members.length} courses, one ordered track</h2>
          <p style="font-size:15px; color:#6a7280; margin:0 0 28px; max-width:60ch;">Work through them in sequence — each course builds on the last. Buy the whole track for one price, or open any course on its own.</p>
          <div class="grid-3">${members.map(courseCard).join('') || '<p style="color:#6a7280;">Courses for this path are listed on Thinkific.</p>'}</div>
        </section>

        <section class="wrap" style="padding-bottom:80px;">
          <div class="card" style="display:flex; align-items:center; justify-content:space-between; gap:20px; flex-wrap:wrap; padding:30px 34px; border:1.5px solid #1f4733;">
            <div>
              <h3 style="font-size:24px; margin:0 0 6px;">Ready to start the ${esc(p.name)}?</h3>
              <p style="font-size:14px; color:#6a7280; margin:0;">One payment · lifetime access · ${p.n} courses${save>0?` · save $${save} vs buying separately`:''}.</p>
            </div>
            <a class="btn-primary" href="${esc(bundleUrl(p))}" target="_blank" rel="noopener">Enroll for $${p.price} →</a>
          </div>
        </section>`;
    }

    (async function(){
      const data = await fetchCatalog();
      const paths = (data && data.paths) || MERIDIAN_DATA.paths;
      const courses = (data && data.courses) || MERIDIAN_DATA.courses;
      const p = paths.find(x => (x.slug||x.thinkificSlug) === slug);
      if (!p) return notFound();
      // resolve member courses: entries may be slugs, ids, or full course objects
      const members = (p.courses||[]).map(ref => {
        if (ref && typeof ref === 'object') return normalizeCourse(ref, 0);
        return courses.find(c => (c.slug||c.thinkificSlug) === ref || String(c.thinkificCourseId) === String(ref));
      }).filter(Boolean);
      render(p, members);
    })();
  </script>
</body>
</html>
